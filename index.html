<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontrol Relay ESP32</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --primary-light: #642b73;
            --primary-dark: #c6426e;
            --accent: #c6426e;
            --danger: #6c757d;
            --success: #c6426e;
            --text-muted: #7a7a7a;
        }

        .navbar-dark.bg-primary {
            background: linear-gradient(45deg, var(--primary-light), var(--primary-dark)) !important;
        }

        .form-switch .form-check-input {
            width: 3.8em;
            height: 2em;
            margin-right: 20px;
            background-color: var(--danger);
            border-color: var(--danger);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .form-switch .form-check-input:checked {
            background-color: var(--success);
            border-color: var(--success);
        }

        .lampu-icon {
            font-size: 2.2rem;
            transition: all 0.3s ease;
        }

        .icon-active {
            color: var(--success);
            filter: drop-shadow(0 0 8px rgba(198, 66, 110, 0.4));
        }

        .icon-inactive {
            color: var(--text-muted);
            opacity: 0.7;
        }
    </style>
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary py-3">
        <div class="container">
            <a class="navbar-brand" href="#">ESP32 <strong>Relay</strong></a>
        </div>
    </nav>

    <div class="container mt-5">
        <h2 class="mb-4">Kontrol Relay</h2>
        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-2 g-4">
            <!-- Ulangi untuk 4 lampu -->
            <!-- Relay 1 -->
            <div class="col">
                <div class="card shadow-sm border-0">
                    <div class="card-body d-flex justify-content-between align-items-center">
                        <div class="d-flex align-items-center">
                            <i id="icon-lampu-1" class="lampu-icon fas fa-lightbulb me-3 icon-inactive"></i>
                            <h5 class="mb-0">Relay 1</h5>
                        </div>
                        <div class="form-check form-switch">
                            <input id="switch-lampu-1" class="form-check-input" type="checkbox">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Relay 2 -->
            <div class="col">
                <div class="card shadow-sm border-0">
                    <div class="card-body d-flex justify-content-between align-items-center">
                        <div class="d-flex align-items-center">
                            <i id="icon-lampu-2" class="lampu-icon fas fa-lightbulb me-3 icon-inactive"></i>
                            <h5 class="mb-0">Relay 2</h5>
                        </div>
                        <div class="form-check form-switch">
                            <input id="switch-lampu-2" class="form-check-input" type="checkbox">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Relay 3 -->
            <div class="col">
                <div class="card shadow-sm border-0">
                    <div class="card-body d-flex justify-content-between align-items-center">
                        <div class="d-flex align-items-center">
                            <i id="icon-lampu-3" class="lampu-icon fas fa-lightbulb me-3 icon-inactive"></i>
                            <h5 class="mb-0">Relay 3</h5>
                        </div>
                        <div class="form-check form-switch">
                            <input id="switch-lampu-3" class="form-check-input" type="checkbox">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Relay 4 -->
            <div class="col">
                <div class="card shadow-sm border-0">
                    <div class="card-body d-flex justify-content-between align-items-center">
                        <div class="d-flex align-items-center">
                            <i id="icon-lampu-4" class="lampu-icon fas fa-lightbulb me-3 icon-inactive"></i>
                            <h5 class="mb-0">Relay 4</h5>
                        </div>
                        <div class="form-check form-switch">
                            <input id="switch-lampu-4" class="form-check-input" type="checkbox">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- JS MQTT -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/5.10.4/mqtt.min.js"></script>
    <script>
        const brokerUrl = 'wss://broker.emqx.io:8084/mqtt';
        const clientId = 'web-client-' + Math.random().toString(16).substr(2, 8);

        const client = mqtt.connect(brokerUrl, {
            clientId: clientId,
            clean: true,
            connectTimeout: 4000
        });

        client.on('connect', () => {
            console.log('Terhubung ke MQTT broker');
        });

        client.on('error', (err) => {
            console.error('MQTT Error:', err);
        });

        function updateStatusLampu(id, status) {
            const topic = "test/1212121/hello";
            const message = `relay${id}_${status.toLowerCase()}`;

            client.publish(topic, message, { qos: 0 }, (err) => {
                if (err) {
                    console.error(`Gagal publish ke ${topic}:`, err);
                } else {
                    console.log(`Pesan dikirim: ${message}`);
                }
            });
        }

        for (let i = 1; i <= 4; i++) {
            const switchEl = document.getElementById(`switch-lampu-${i}`);
            const iconEl = document.getElementById(`icon-lampu-${i}`);

            switchEl.addEventListener('change', function () {
                const status = this.checked ? 'ON' : 'OFF';
                iconEl.classList.toggle('icon-active', status === 'ON');
                iconEl.classList.toggle('icon-inactive', status === 'OFF');
                updateStatusLampu(i, status);
            });
        }
    </script>
</body>
</html>
